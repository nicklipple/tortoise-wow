stages:
  - build

image: docker:27.5.1

services:
  - name: docker:27.5.1-dind
    alias: docker

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"

build-images:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -eu

      server_image="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
      extractors_image="${CI_REGISTRY_IMAGE}/extractors:${CI_COMMIT_SHA}"

      docker build --pull --file Dockerfile --tag "${server_image}" .
      docker build --pull --file Dockerfile.extractors --tag "${extractors_image}" .

      docker push "${server_image}"
      docker push "${extractors_image}"

      if [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        for tag in latest stable; do
          docker tag "${server_image}" "${CI_REGISTRY_IMAGE}:${tag}"
          docker tag "${extractors_image}" "${CI_REGISTRY_IMAGE}/extractors:${tag}"
          docker push "${CI_REGISTRY_IMAGE}:${tag}"
          docker push "${CI_REGISTRY_IMAGE}/extractors:${tag}"
        done
      fi
